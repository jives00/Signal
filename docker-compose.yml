# The NAS companion and web admin (PLAN §5.2). Lives at /volume2/docker/signal on the NAS, next to
# a .env holding DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME and SIGNAL_SECRET_KEY (PLAN §5.9).
# Everything else is a web admin setting, not an env var.
services:
  signal:
    image: ghcr.io/jives00/signal:latest
    container_name: signal
    ports:
      - "3013:3013"
      # The viewer (web-player.md): the watching page only, so Tailscale can allow it without the admin.
      - "3017:3017"
    env_file:
      - .env
    environment:
      - PORT=3013
      - DATA_DIR=/data
      - RECORDINGS_DIR=/recordings
      # Logs read in local time; the nightly schedule uses its own named time zone either way.
      - TZ=America/Chicago
    volumes:
      # guide.db builds, cached images and logs.
      - /volume2/docker/signal/data:/data
      # The recordings share (dvr.md): a top-level folder, left out of backups and snapshots.
      - /volume2/SignalRecordings:/recordings
    networks:
      - shared-db
    labels:
      # Holds a deploy back while a recording runs: exit 75 tells Watchtower to skip this container and
      # try again at its next poll. Anything else, a hung companion included, lets the update through.
      # Needs WATCHTOWER_LIFECYCLE_HOOKS=true on Watchtower. $$ is compose's escape for $.
      - com.centurylinklabs.watchtower.lifecycle.pre-update=[ "$$(wget -qO- -T 5 http://127.0.0.1:3013/health/recording)" = "busy" ] && exit 75 || exit 0
    # Time on a stop to close the open segments.
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  shared-db:
    external: true
