name: Companion image

# The NAS companion and web admin (PLAN §5.2): on every push to main that touches them, test and
# build both, then push ghcr.io/jives00/signal:latest, which Watchtower deploys within 5 minutes.
# The APK has its own workflows (ci.yml, release.yml).
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build the server
        run: ./gradlew :server:test :server:installDist

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Test and build the web admin
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/jives00/signal:latest
          # Links the package to the public repo, so it's public too and the NAS pulls without logging in.
          labels: |
            org.opencontainers.image.source=https://github.com/jives00/Signal
            org.opencontainers.image.description=Signal's NAS companion and web admin
            org.opencontainers.image.licenses=CC-BY-NC-4.0
