name: CI

# Every push: tests, lint and a debug APK (PLAN §5.10). The companion's Docker image workflow
# arrives with server/ in milestone 3.
on:
  push:
    branches: ["**"]
    tags-ignore: ["apk-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # check = unit tests for shared/ plus Android lint. fixtures-private/ is gitignored, so
      # public CI only ever runs the synthetic-fixture tests (PLAN §1).
      - name: Test, lint and build
        run: ./gradlew check :androidTvApp:assembleDebug :devApp:compileKotlin

      - uses: actions/upload-artifact@v4
        with:
          name: signal-debug-apk
          path: androidTvApp/build/outputs/apk/debug/*.apk
          retention-days: 14
