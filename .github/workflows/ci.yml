name: CI

# Every push: tests (shared/ and server/), lint, a debug APK, and the web admin's typecheck and tests
# (PLAN §5.10). The companion's image is built and pushed by deploy.yml on main.
on:
  push:
    branches: ["**"]
    tags-ignore: ["apk-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # check = unit tests for shared/ plus Android lint. fixtures-private/ is gitignored, so
      # public CI only ever runs the synthetic-fixture tests (PLAN §1).
      - name: Test, lint and build
        run: ./gradlew check :androidTvApp:assembleDebug :devApp:compileKotlin

      # A failed test's message and the screen it saw, for telling a slow runner from a real bug.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/screenshots/
            server/build/reports/tests/
          retention-days: 14

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Web admin
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      - uses: actions/upload-artifact@v7
        with:
          name: signal-debug-apk
          path: androidTvApp/build/outputs/apk/debug/*.apk
          retention-days: 14
