name: Release APK

# An apk-v<version> tag builds a signed release APK and publishes it as a GitHub Release.
# The app's auto-updater compares its own baked-in tag with the newest release (PLAN §4.3.15).
on:
  push:
    tags: ["apk-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches signal.versionName
        run: |
          version=$(grep '^signal.versionName=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "apk-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match gradle.properties (expected apk-v${version})"
            exit 1
          fi

      # The keystore never changes after the first release: a different certificate blocks
      # every in-place update (PLAN §4.3.15). It lives only in these secrets.
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          SIGNAL_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIGNAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew check :androidTvApp:assembleRelease -Psignal.buildTag="${GITHUB_REF_NAME}"

      - name: Verify the signature
        run: |
          apk=androidTvApp/build/outputs/apk/release/androidTvApp-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK was produced (androidTvApp-release-unsigned.apk means signing secrets are missing)"
            exit 1
          fi
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk"
          cp "$apk" "signal-${GITHUB_REF_NAME#apk-}.apk"

      # The app's update panel shows these notes. They come from the annotated tag's message: a few
      # short, plain-English bullets written at release time. A lightweight tag falls back to the
      # commit subjects since the previous release.
      - name: Write the release notes
        run: |
          git fetch --force --tags origin
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag" ]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          else
            prev=$(git tag -l 'apk-v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1)
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"${GITHUB_REF_NAME}" | grep -v '^- Release ' > notes.md || true
          fi
          cat notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "signal-${GITHUB_REF_NAME#apk-}.apk" --title "Signal ${GITHUB_REF_NAME#apk-}" --notes-file notes.md
