#Signal
# The one version shared by the app, the companion and the web admin (PLAN §5.10).
# versionCode is derived from it: major * 10000 + minor * 100 + patch.
signal.versionName=0.2.12

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
